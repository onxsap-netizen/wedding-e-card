<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#231e18">
<title>Aarav & Meera Wedding Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: six full-screen chapters over one painted coastal scene that moves from sunrise to starlight as you scroll. */
:root{
  --ink:#231e18;        /* deep earth */
  --ivory:#f6f0e6;      /* text */
  --sand:#d8bf93;       /* soft accent */
  --gold:#c9a15b;       /* accent */
  --clay:#8a5a3c;       /* warm secondary */
  --veil:rgba(35,30,24,.42);
  --display:"Cormorant Garamond","Times New Roman",serif;
  --body:"Jost","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-snap-type:y proximity;scroll-behavior:smooth}
body{background:var(--ink);color:var(--ivory);font-family:var(--body);font-weight:300;line-height:1.65;font-size:16px;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.08;text-wrap:balance}
em{font-style:italic;color:var(--sand)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}

/* loader */
#loader{position:fixed;inset:0;z-index:60;background:var(--ink);display:grid;place-items:center;transition:opacity .9s ease,visibility .9s}
#loader.done{opacity:0;visibility:hidden}
.ld{text-align:center}
.ld .m{font-family:var(--display);font-size:3rem;color:var(--sand);letter-spacing:.08em}
.ld .p{margin-top:.6rem;font-size:.72rem;letter-spacing:.4em;color:var(--sand);opacity:.8;font-variant-numeric:tabular-nums}
.ld .bar{width:140px;height:1px;background:rgba(216,191,147,.25);margin:14px auto 0;position:relative;overflow:hidden}
.ld .bar i{position:absolute;inset:0;width:0;background:var(--gold);transition:width .15s}

/* chapter rail */
.rail{position:fixed;left:18px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:12px}
.rail a{font-size:.68rem;letter-spacing:.18em;text-decoration:none;color:var(--ivory);opacity:.45;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;transition:.3s}
.rail a::before{content:"";width:10px;height:1px;background:currentColor;transition:.3s}
.rail a.on{opacity:1;color:var(--sand)}
.rail a.on::before{width:22px}
@media (max-width:640px){.rail{left:auto;right:10px;gap:9px}.rail a::before{display:none}.rail a{font-size:.62rem}}

/* chapters */
.ch{position:relative;z-index:2;min-height:100svh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:90px 24px 120px}
.panel{max-width:620px;width:100%;text-align:center}
.ch.sky{align-items:flex-start;padding-top:max(80px,11svh)}
.panel.left{text-align:left}
.kicker{font-size:.7rem;letter-spacing:.42em;text-transform:uppercase;color:var(--sand);margin-bottom:1.2rem}
.panel h2{font-size:clamp(2.4rem,9vw,4.2rem);font-weight:400;margin-bottom:1.1rem;text-shadow:0 2px 30px rgba(35,30,24,.55)}
.panel p.lead{font-size:1.05rem;max-width:44ch;margin:0 auto;text-shadow:0 1px 14px rgba(35,30,24,.7)}
.panel.left p.lead{margin:0}
.glass{background:var(--veil);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(246,240,230,.14);border-radius:18px;padding:28px 24px}

/* hero */
.bless{font-family:var(--display);font-style:italic;color:var(--sand);font-size:1rem;margin-bottom:1.6rem;text-shadow:0 1px 10px rgba(35,30,24,.6)}
.hero h1{font-size:clamp(3.4rem,16vw,7rem);font-weight:400;text-shadow:0 4px 40px rgba(35,30,24,.5)}
.hero h1 .amp{display:block;font-style:italic;color:var(--sand);font-size:.42em;margin:.15em 0}
.hero .line{text-shadow:0 1px 10px rgba(20,16,12,.9);margin-top:1.6rem;font-size:.74rem;letter-spacing:.38em;text-transform:uppercase}
.count{display:inline-flex;padding:12px 20px;border-radius:16px;background:rgba(35,30,24,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);justify-content:center;gap:clamp(16px,6vw,38px);margin-top:2.2rem}
.count b{display:block;font-family:var(--display);font-size:clamp(1.9rem,8vw,2.8rem);font-weight:500;font-variant-numeric:tabular-nums}
.count span{font-size:.6rem;letter-spacing:.32em;text-transform:uppercase;color:var(--sand)}

/* events */
.evs{display:grid;gap:12px;margin-top:1.6rem;text-align:left}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:4px 16px;align-items:center;padding:16px 18px;border-radius:14px;background:rgba(35,30,24,.5);border:1px solid rgba(246,240,230,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ev .date{grid-row:1/span 3;text-align:center;border-right:1px solid rgba(216,191,147,.3);padding-right:12px}
.ev .date b{display:block;font-family:var(--display);font-size:2rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.ev .date span{font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--sand)}
.ev h3{font-size:1.5rem}
.ev .t{font-size:.85rem;color:var(--sand)}
.ev .v{font-size:.85rem;opacity:.85}
.ev .cal{grid-row:1/span 3;grid-column:3}
@media (max-width:480px){.ev{grid-template-columns:56px 1fr}.ev .cal{grid-row:auto;grid-column:2;justify-self:start;margin-top:6px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--body);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;padding:11px 18px;border-radius:999px;border:1px solid var(--gold);color:var(--sand);background:transparent;text-decoration:none;cursor:pointer;transition:.25s;white-space:nowrap}
.btn:hover{background:var(--gold);color:var(--ink)}
.btn.solid{background:var(--gold);color:var(--ink)}
.btn.solid:hover{background:var(--ivory);border-color:var(--ivory)}
.btn.sm{padding:8px 13px;font-size:.62rem}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:1.8rem}
.panel.left .row{justify-content:flex-start}

.venue .place{font-family:var(--display);font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.15}
.venue .addr{margin:.6rem 0 0;opacity:.9}
.venue .note{margin-top:1rem;font-size:.85rem;color:var(--sand)}

.fam{margin-top:1.6rem;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--sand)}
.by{margin-top:1rem;font-size:.82rem;opacity:.85}

/* next chapter button */
#next{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ivory);cursor:pointer;font-family:var(--body);font-size:.62rem;letter-spacing:.35em;text-transform:uppercase;padding:8px 16px 10px;border-radius:18px;background:rgba(35,30,24,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-shadow:0 1px 10px rgba(35,30,24,.8)}
#next .arr{width:34px;height:34px;border-radius:50%;border:1px solid rgba(246,240,230,.5);display:grid;place-items:center;font-size:.9rem;letter-spacing:0;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}

/* rsvp dialog */
dialog{margin:auto;border:1px solid rgba(216,191,147,.3);border-radius:20px;background:#2b241d;color:var(--ivory);width:min(440px,calc(100% - 32px));padding:28px 24px}
dialog::backdrop{background:rgba(20,16,12,.7);backdrop-filter:blur(4px)}
dialog h3{font-size:2rem;margin-bottom:.3rem}
dialog .sub{font-size:.82rem;color:var(--sand);margin-bottom:1.4rem}
form{display:grid;gap:18px}
label,legend{display:block;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--sand);margin-bottom:6px}
fieldset{border:0}
input[type=text],select,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(246,240,230,.22);color:var(--ivory);font:300 1rem var(--body);padding:8px 2px}
select option{background:#2b241d}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice label{margin:0;padding:10px 16px;border:1px solid rgba(246,240,230,.22);border-radius:999px;cursor:pointer;letter-spacing:.02em;text-transform:none;font-size:.9rem;color:var(--ivory)}
.choice input:checked+label{border-color:var(--gold);color:var(--sand);background:rgba(201,161,91,.12)}
.choice input:focus-visible+label{outline:2px solid var(--gold);outline-offset:3px}
.dlg-actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.x{background:none;border:0;color:var(--sand);font:400 .7rem var(--body);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
#done{display:none;font-size:.95rem}
#done .btn{margin-top:14px}

#front{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;display:block}
.ch.hero.sky{padding-top:max(64px,12svh)}
.hero .bless,.hero h1,.hero .lede{position:relative;z-index:0}
.hero .line,.hero .count{position:relative;z-index:2}
.hero .bless{color:#5a3f2c;text-shadow:none;font:500 .66rem var(--body);letter-spacing:.3em;text-transform:uppercase;margin-bottom:1.2rem}
.hero h1{color:#3b261d;text-shadow:0 1px 1px rgba(255,248,236,.5);font-weight:500}
.hero h1 .amp{color:#9a6a3a}
.hero .lede{font-family:var(--display);font-style:italic;font-size:clamp(1.1rem,3.4vw,1.4rem);color:#4a3328;margin:-.4rem 0 .6rem;line-height:1.35}
.hero h1{font-size:clamp(3rem,min(16vw,11svh),7rem)}
.ch.hero{padding-bottom:90px}
.hero .count{margin-top:1rem;padding:8px 16px}
.hero .count b{font-size:clamp(1.5rem,6vw,2.2rem)}
.hero .line{display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(35,30,24,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none!important;margin-top:1.3rem!important;letter-spacing:.2em!important;font-size:.64rem!important;white-space:nowrap}
.hero .when-wrap{display:flex;flex-direction:column;align-items:center}
@keyframes rise{from{transform:translateY(16px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="loader" aria-hidden="true"><div class="ld"><div class="m" id="ldMono"></div><div class="bar"><i id="ldBar"></i></div><div class="p" id="ldPct">0%</div></div></div>

<canvas id="scene" aria-hidden="true"></canvas>

<nav class="rail" aria-label="Chapters" id="rail"></nav>

<main>
  <section class="ch hero sky" id="c1" data-name="Welcome">
    <canvas id="front" aria-hidden="true"></canvas>
    <div class="panel">
      <p class="bless" id="bless"></p>
      <p class="lede" id="lede"></p>
      <h1><span id="n1"></span><span class="amp">&amp;</span><span id="n2"></span></h1>
      <div class="when-wrap"><p class="line" id="when"></p></div>
      <div class="count" aria-label="Countdown to the wedding">
        <div><b id="cd-d">0</b><span>Days</span></div>
        <div><b id="cd-h">00</b><span>Hrs</span></div>
        <div><b id="cd-m">00</b><span>Min</span></div>
        <div><b id="cd-s">00</b><span>Sec</span></div>
      </div>
    </div>
  </section>

  <section class="ch sky" id="c2" data-name="Story">
    <div class="panel"><p class="kicker" id="s1k"></p><h2 id="s1h"></h2><p class="lead" id="s1p"></p></div>
  </section>

  <section class="ch sky" id="c3" data-name="Story">
    <div class="panel"><p class="kicker" id="s2k"></p><h2 id="s2h"></h2><p class="lead" id="s2p"></p></div>
  </section>

  <section class="ch" id="c4" data-name="Celebrations">
    <div class="panel">
      <p class="kicker">The celebrations</p>
      <h2>Three days <em>by the shore</em></h2>
      <div class="evs" id="evs"></div>
    </div>
  </section>

  <section class="ch venue" id="c5" data-name="Venue">
    <div class="panel glass left">
      <p class="kicker">The venue</p>
      <div class="place" id="vName"></div>
      <p class="addr" id="vAddr"></p>
      <p class="note" id="vNote"></p>
      <div class="row"><a class="btn" id="vMap" href="#" target="_blank" rel="noopener">Open in Google Maps</a></div>
    </div>
  </section>

  <section class="ch sky" id="c6" data-name="Invitation">
    <div class="panel">
      <p class="kicker">You are invited</p>
      <h2 id="invH"></h2>
      <p class="lead" id="invP"></p>
      <p class="fam" id="fam"></p>
      <div class="row">
        <a class="btn solid" id="save" href="#" target="_blank" rel="noopener">Save the date</a>
        <button class="btn" type="button" id="openRsvp">RSVP</button>
      </div>
      <p class="by" id="by"></p>
    </div>
  </section>
</main>

<button id="next" type="button"><span id="nextLbl">Next chapter</span><span class="arr" id="nextArr">↓</span></button>

<dialog id="rsvp" aria-labelledby="rsvpTitle">
  <form id="rsvpForm" novalidate>
    <div><h3 id="rsvpTitle">Will you join us?</h3><p class="sub" id="rsvpSub"></p></div>
    <div><label for="rName">Your name</label><input type="text" id="rName" autocomplete="name"></div>
    <fieldset><legend>Attending</legend>
      <div class="choice">
        <input type="radio" id="rYes" name="att" value="Yes, with joy" checked><label for="rYes">Yes, with joy</label>
        <input type="radio" id="rNo" name="att" value="Can't make it, sending love"><label for="rNo">Can't make it</label>
      </div>
    </fieldset>
    <div><label for="rCount">Guests</label><select id="rCount"></select></div>
    <div><label for="rMsg">A note for the couple</label><textarea id="rMsg" rows="2"></textarea></div>
    <div class="dlg-actions"><button type="button" class="x" id="closeRsvp">Close</button><button class="btn solid" type="submit">Send on WhatsApp</button></div>
  </form>
  <div id="done" role="status"></div>
</dialog>

<script>
/* ============================================================
   EDIT YOUR DETAILS HERE. Everything on the card comes from this block.
   Dates: YYYY-MM-DDTHH:MM in 24-hour Indian time.
   ============================================================ */
const CONFIG = {
  groom: "Aarav",
  bride: "Meera",
  blessing: "With our families' blessings",
  lede: "Two hearts, one home, and a seat saved for you.",
  city: "Rameswaram, Tamil Nadu",
  wedding: "2027-02-13T18:30",
  rsvpBy: "15 January 2027",
  whatsapp: "919876543210",           // country code + number, no + or spaces
  families: "With blessings of the Sharma & Iyer families",
  story: [
    {kicker: "Chapter one", title: "Where the tide <em>first met us</em>", text: "A pilgrimage, a crowded ferry and one shared umbrella. We talked the whole way across and never really stopped."},
    {kicker: "Chapter two", title: "Every sunrise, <em>a little more</em>", text: "Morning calls, long walks and a hundred small promises. One day we noticed home had become a person."}
  ],
  inviteTitle: "Come, be part of <em>our beginning</em>",
  inviteText: "We would be honoured to have you with us by the sea as we take our seven steps together.",
  events: [
    {name: "Haldi", start: "2027-02-12T09:30", end: "2027-02-12T12:00", venue: "Garden Courtyard"},
    {name: "Mehendi & Sangeet", start: "2027-02-12T17:30", end: "2027-02-12T23:00", venue: "Beach Lawn"},
    {name: "Wedding", start: "2027-02-13T18:30", end: "2027-02-13T22:30", venue: "Seaside Mandap"}
  ],
  venue: {
    name: "The Seashore Residency",
    address: "Ramar Theertham Road, Rameswaram, Tamil Nadu 623526",
    note: "Nearest airport: Madurai (IXM), about 3.5 hours by road. Rameswaram railway station is 10 minutes away.",
    mapsQuery: "Rameswaram Tamil Nadu"
  }
};
/* ============================================================ */

const $=id=>document.getElementById(id);
const d=s=>new Date(s);
const stamp=s=>d(s).toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
const gcal=(t,s,e,l,x)=>"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t)+"&dates="+stamp(s)+"/"+stamp(e)+"&location="+encodeURIComponent(l)+"&details="+encodeURIComponent(x||"");
const couple=CONFIG.groom+" & "+CONFIG.bride;

document.title=couple+" Wedding Invite";
$("ldMono").textContent=CONFIG.groom[0]+" · "+CONFIG.bride[0];
$("bless").textContent=CONFIG.blessing; $("lede").textContent=CONFIG.lede;
$("n1").textContent=CONFIG.groom; $("n2").textContent=CONFIG.bride;
const f=d(CONFIG.events[0].start), w=d(CONFIG.wedding);
$("when").textContent=(f.getMonth()===w.getMonth()&&f.getDate()!==w.getDate()
  ? f.getDate()+"–"+w.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})
  : w.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"}));
$("when").textContent+=" · "+CONFIG.city.split(",")[0];

CONFIG.story.forEach((s,i)=>{ $("s"+(i+1)+"k").textContent=s.kicker; $("s"+(i+1)+"h").innerHTML=s.title; $("s"+(i+1)+"p").textContent=s.text; });

const loc=CONFIG.venue.name+", "+CONFIG.venue.address;
$("evs").innerHTML=CONFIG.events.map(e=>{const s=d(e.start);return `
  <article class="ev">
    <div class="date"><b>${s.getDate()}</b><span>${s.toLocaleDateString("en-IN",{month:"short"})}</span></div>
    <h3>${e.name}</h3>
    <span class="t">${s.toLocaleDateString("en-IN",{weekday:"long"})} · ${s.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})}</span>
    <span class="v">${e.venue}</span>
    <a class="btn sm cal" target="_blank" rel="noopener" href="${gcal(e.name+" · "+couple,e.start,e.end,e.venue+", "+loc)}">Add to calendar</a>
  </article>`}).join("");

$("vName").textContent=CONFIG.venue.name; $("vAddr").textContent=CONFIG.venue.address; $("vNote").textContent=CONFIG.venue.note;
$("vMap").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(CONFIG.venue.mapsQuery);
$("invH").innerHTML=CONFIG.inviteTitle; $("invP").textContent=CONFIG.inviteText; $("fam").textContent=CONFIG.families;
const wEnd=new Date(w.getTime()+4*36e5).toISOString();
$("save").href=gcal(couple+"'s Wedding",CONFIG.wedding,wEnd,loc,CONFIG.inviteText);
$("by").textContent="Kindly reply by "+CONFIG.rsvpBy+".";
$("rsvpSub").textContent="Kindly reply by "+CONFIG.rsvpBy+". This opens WhatsApp with your reply ready to send.";
$("rCount").innerHTML=[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join("");

/* countdown */
function tick(){let ms=Math.max(0,w-Date.now());const D=Math.floor(ms/864e5);ms-=D*864e5;const H=Math.floor(ms/36e5);ms-=H*36e5;const M=Math.floor(ms/6e4),S=Math.floor((ms-M*6e4)/1e3);
  $("cd-d").textContent=D;$("cd-h").textContent=String(H).padStart(2,"0");$("cd-m").textContent=String(M).padStart(2,"0");$("cd-s").textContent=String(S).padStart(2,"0");}
tick(); setInterval(tick,1000);

/* chapters: rail + next button */
const chs=[...document.querySelectorAll(".ch")];
$("rail").innerHTML=chs.map((c,i)=>`<a href="#${c.id}" aria-label="${c.dataset.name}">${String(i+1).padStart(2,"0")}</a>`).join("");
const rail=[...$("rail").children];
let cur=0;
function setCur(i){cur=i;rail.forEach((a,j)=>a.classList.toggle("on",j===i));
  const last=i===chs.length-1; $("nextLbl").textContent=last?"Back to the start":"Next chapter"; $("nextArr").textContent=last?"↑":"↓";}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setCur(chs.indexOf(e.target));}),{threshold:.5});
chs.forEach(c=>io.observe(c)); setCur(0);
$("next").onclick=()=>{const t=cur===chs.length-1?chs[0]:chs[cur+1]; t.scrollIntoView({behavior:"smooth"});};

/* RSVP dialog */
const dlg=$("rsvp");
$("openRsvp").onclick=()=>{ $("rsvpForm").style.display=""; $("done").style.display="none"; dlg.showModal(); };
$("closeRsvp").onclick=()=>dlg.close();
$("rsvpForm").addEventListener("submit",ev=>{ev.preventDefault();
  const n=$("rName").value.trim(); if(!n){$("rName").focus();$("rName").placeholder="Please add your name";return;}
  const att=document.querySelector('input[name="att"]:checked').value;
  const msg=`RSVP · ${couple}'s wedding\nName: ${n}\nAttending: ${att}\nGuests: ${$("rCount").value}\nNote: ${$("rMsg").value.trim()||"-"}`;
  const url="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg);
  $("rsvpForm").style.display="none"; $("done").style.display="block";
  $("done").innerHTML=`<h3>Thank you, ${n.replace(/</g,"&lt;")}</h3><p>Tap below to send your reply.</p><a class="btn solid" href="${url}" target="_blank" rel="noopener">Open WhatsApp</a> <button class="x" type="button" onclick="document.getElementById('rsvp').close()">Close</button>`;
});

/* loader */
(function(){let p=0;const iv=setInterval(()=>{p=Math.min(100,p+Math.ceil(Math.random()*12));$("ldPct").textContent=p+"%";$("ldBar").style.width=p+"%";
  if(p>=100){clearInterval(iv);setTimeout(()=>$("loader").classList.add("done"),300);}},60);
  setTimeout(()=>$("loader").classList.add("done"),2600);})();

/* ===== Photo backdrop with the tower cut out and layered in front of the opening names. ===== */
(function(){
  const c=$("scene"), x=c.getContext("2d"), f=$("front"), fx=f.getContext("2d"); let W,H,DPR;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const img=new Image(); img.src="temple.jpg"; img.onload=()=>frame();
  const tw=new Image(); tw.src="tower.png"; tw.onload=()=>frame();
  function size(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;[c,f].forEach(k=>{k.width=W*DPR;k.height=H*DPR;});x.setTransform(DPR,0,0,DPR,0,0);fx.setTransform(DPR,0,0,DPR,0,0);}
  size(); addEventListener("resize",()=>{size();frame();});
  const G=[
    {tint:"#fbf4ea", top:0,   star:0},   // clear morning (opening)
    {tint:"#efcfac", top:.5,  star:0},   // first warmth
    {tint:"#e9b779", top:.52, star:0},   // golden hour
    {tint:"#c98a7c", top:.58, star:0},   // dusk
    {tint:"#7d6a8c", top:.62, star:.5},  // twilight
    {tint:"#4a4670", top:.66, star:1}    // night
  ];
  const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")})`;};
  const stars=Array.from({length:110},()=>({x:Math.random(),y:Math.random()*.42,r:Math.random()*1.1+.25,p:Math.random()*6}));
  let T=0, raf=0;
  function frame(){
    raf=0;
    const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
    const q=Math.min(1,Math.max(0,scrollY/max)), prog=q*(G.length-1);
    const i=Math.min(G.length-2,Math.floor(prog)), t=prog-i, A=G[i], B=G[i+1];
    x.fillStyle="#231e18"; x.fillRect(0,0,W,H);
    let P=null;
    if(img.complete&&img.naturalWidth){
      const zoom=1.1-q*.1+(reduce?0:Math.sin(T*.004)*.005);
      const iw=img.naturalWidth, ih=img.naturalHeight;
      const sc=Math.max(H/ih*zoom, Math.min(W/iw, H/ih*1.6)*zoom);
      const dw=iw*sc, dh=ih*sc;
      const want=(.425-q*.25)*H;                        // tower crown mid-screen, then rises
      const dy=Math.min(0,Math.max(H-dh,want-.433*dh)), dx=(W-dw)/2;
      P={dx,dy,dw,dh};
      if(dx>0){x.drawImage(img,0,0,2,ih,0,dy,dx+2,dh);x.drawImage(img,iw-2,0,2,ih,dx+dw-2,dy,W-(dx+dw)+2,dh);}
      x.drawImage(img,dx,dy,dw,dh);
    }
    const tint=mix(A.tint,B.tint,t);
    x.globalCompositeOperation="multiply"; x.fillStyle=tint; x.fillRect(0,0,W,H);
    x.globalCompositeOperation="source-over";
    const st=A.star+(B.star-A.star)*t;
    if(st>0){stars.forEach(s=>{x.globalAlpha=st*(.45+.55*Math.sin(T*.03+s.p));x.fillStyle="#fff6e6";x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill();});x.globalAlpha=1;}
    if(prog>2.6){const gl=x.createRadialGradient(W/2,H*.98,0,W/2,H*.98,H*.5);gl.addColorStop(0,`rgba(240,170,90,${Math.min(.35,(prog-2.6)*.18)})`);gl.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gl;x.fillRect(0,0,W,H);}
    const top=A.top+(B.top-A.top)*t, bot=Math.min(.6,.25+prog*.2);
    const g=x.createLinearGradient(0,0,0,H);
    g.addColorStop(0,`rgba(28,22,18,${top})`);g.addColorStop(.5,`rgba(28,22,18,${top*.2})`);g.addColorStop(.8,"rgba(28,22,18,.15)");g.addColorStop(1,`rgba(28,22,18,${bot})`);
    x.fillStyle=g;x.fillRect(0,0,W,H);
    // front layer: just the tower, graded identically, drawn over the opening names
    if(P&&tw.complete&&tw.naturalWidth&&q<.2){
      const {dx,dy,dw,dh}=P;
      fx.globalCompositeOperation="source-over";fx.clearRect(0,0,W,H);fx.drawImage(tw,dx,dy,dw,dh);
      fx.globalCompositeOperation="multiply";fx.fillStyle=tint;fx.fillRect(0,0,W,H);
      fx.globalCompositeOperation="source-over";fx.fillStyle=g;fx.fillRect(0,0,W,H);
      fx.globalCompositeOperation="destination-in";fx.drawImage(tw,dx,dy,dw,dh);
      fx.globalCompositeOperation="source-over";
      f.style.opacity=String(Math.max(0,1-q*7));
    } else if(f.style.opacity!=="0"){fx.clearRect(0,0,W,H);f.style.opacity="0";}
    T++;
    if(!reduce&&!raf)raf=requestAnimationFrame(frame);
  }
  frame();
  if(reduce)addEventListener("scroll",()=>requestAnimationFrame(frame),{passive:true});
})();
</script>
